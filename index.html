
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>SNS冷笑度診断</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    body {
      font-family: 'Arial', sans-serif;
      font-size: 16px;
      line-height: 1.6;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    
      background-color: #111;
      color: #eee;
      text-align: center;
      padding: 2rem;
    }
    .question {
      margin: 2rem 0;
    }
    button {
      background-color: #222;
      width: 90%;
      max-width: 400px;
      box-sizing: border-box;
    
      color: #eee;
      border: 1px solid #555;
      margin: 0.5rem;
      padding: 1rem 2rem;
      cursor: pointer;
    }
    button:hover {
      background-color: #444;
    }
    #result {
      display: none;
      margin-top: 3rem;
      opacity: 0;
      transform: translateY(20px);
      transition: all 1s ease;
    }
    #result.visible {
      opacity: 1;
      transform: translateY(0);
    }
    #progress-container {
      width: 100%;
      background-color: #333;
      border-radius: 5px;
      margin-top: 20px;
    }
    #progress-bar {
      width: 0%;
      height: 10px;
      background-color: #4caf50;
      border-radius: 5px;
      transition: width 0.5s ease;
    }
    .share {
      margin-top: 2rem;
    }
    .share a {
      display: inline-block;
      padding: 0.5rem 1rem;
      background-color: #1da1f2;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      transition: background 0.3s ease;
    }
    .share a:hover {
      background-color: #0d95e8;
    }
  </style>
</head>
<body>
  <h1>SNS冷笑度診断</h1>
  <div id="quiz">
    <div id="progress-container">
      <div id="progress-bar"></div>
    </div>
    <div id="question" class="question"></div>
    <div id="choices"></div>
  </div>
  <div id="result">
    <h2>診断結果</h2>
    <p id="score"></p>
    <p id="type"></p>
    <div class="share">
      <a id="tweet-button" href="#" target="_blank">結果をXでシェアする</a>
    </div>
  </div>
  <script>
const questions = [ { q: "フォロワーがテンション高めの投稿をしている。あなたは？", choices: [ { text: "一緒に盛り上がる気分になる", score: 0 }, { text: "少し引いて眺めてしまう", score: 1 }, { text: "そのテンション感を記録することが多い", score: 2 } ] },
      { q: "深夜のタイムラインを見ている時の自分の気分は？", choices: [ { text: "ちょっと寂しいけど安心する", score: 0 }, { text: "落ち着いていて考えごとに向いている", score: 1 }, { text: "誰かの無防備な瞬間を拾ってる気がする", score: 2 } ] },
      { q: "共感がたくさん集まっている投稿を見ると？", choices: [ { text: "わかる〜って思って押す", score: 0 }, { text: "ちょっと盛りすぎかなと感じる", score: 1 }, { text: "共感という空気の流れ自体を観察する", score: 2 } ] },
      { q: "“ポエムっぽい”投稿に遭遇したとき？", choices: [ { text: "しみじみ読んで気持ちを想像する", score: 0 }, { text: "少し照れくさくなる", score: 1 }, { text: "構成や流れが型になってるか見てしまう", score: 2 } ] },
      { q: "ある人の投稿がバズり始めた時の自分は？", choices: [ { text: "わーすごいって純粋に思う", score: 0 }, { text: "なんでだろうと原因を探す", score: 1 }, { text: "過去の傾向と比較して分析する", score: 2 } ] },
      { q: "投稿をする前のあなたの意識は？", choices: [ { text: "素直な気持ちをそのまま書く", score: 0 }, { text: "見た人がどう思うか少し気にする", score: 1 }, { text: "タイムラインの“流れ”に合うか見て調整する", score: 2 } ] },
      { q: "誰かがネガティブなことを投稿していたら？", choices: [ { text: "心配になって様子を見る", score: 0 }, { text: "少し重いなと距離を取る", score: 1 }, { text: "どういう流れでそうなったかを探る", score: 2 } ] },
      { q: "タイムラインが“幸せ”であふれている時の気持ち", choices: [ { text: "こちらも前向きな気持ちになる", score: 0 }, { text: "なんだか落ち着かない", score: 1 }, { text: "それがどんな意図や文脈か読もうとする", score: 2 } ] },
      { q: "流行っている構文を見かけた時", choices: [ { text: "面白い！って普通に思う", score: 0 }, { text: "見慣れてきたなと感じる", score: 1 }, { text: "派生や起源を考え始める", score: 2 } ] },
      { q: "投稿しても反応が少なかった時の気持ち", choices: [ { text: "まあそんな時もあるよね", score: 0 }, { text: "少しだけしょんぼりする", score: 1 }, { text: "どうして反応が薄いのか理由を探る", score: 2 } ] },
      { q: "“鍵垢にします”系の投稿を見かけたら？", choices: [ { text: "何かあったのかな？と気になる", score: 0 }, { text: "そこまで言わなくても…と戸惑う", score: 1 }, { text: "この行動の意味や効果を考える", score: 2 } ] },
      { q: "SNSでの“いいね”はどういう感覚？", choices: [ { text: "共感や応援の気持ち", score: 0 }, { text: "自分との距離感の確認", score: 1 }, { text: "記録と分類の手段として", score: 2 } ] },
      { q: "誰かの“いい話”投稿を見たときの反応", choices: [ { text: "素直にじーんとくる", score: 0 }, { text: "どこまで本当か考えてしまう", score: 1 }, { text: "“物語化”の意図を考える", score: 2 } ] },
      { q: "自分の“いいね”欄を誰かに見られると？", choices: [ { text: "ちょっと恥ずかしいけどまあOK", score: 0 }, { text: "人によっては見せたくないかも", score: 1 }, { text: "“見せる用”と“観察用”で分けてる", score: 2 } ] },
      { q: "バズった人が急に病みツイートを始めたら？", choices: [ { text: "大丈夫かなって心配になる", score: 0 }, { text: "やっぱりSNSって怖いなと思う", score: 1 }, { text: "その流れに既視感を感じてしまう", score: 2 } ] },
      { q: "「誰か描いてください」系の投稿を見た時", choices: [ { text: "描ける人いたらいいなって思う", score: 0 }, { text: "なんかすごく自己表現したいんだなと感じる", score: 1 }, { text: "そういう構文のリズムに反応してしまう", score: 2 } ] },
      { q: "投稿を見る時、一番気になるのは？", choices: [ { text: "内容・中身そのもの", score: 0 }, { text: "構成や言葉選び", score: 1 }, { text: "誰にどう見られるか想定されてるかどうか", score: 2 } ] },
      { q: "SNSをやめたくなる瞬間は？", choices: [ { text: "人間関係がつらい時", score: 0 }, { text: "見せ方に疲れた時", score: 1 }, { text: "観察対象が固定化してきた時", score: 2 } ] },
      { q: "SNSの“正義”っぽい言葉が並ぶと？", choices: [ { text: "気持ちはわかると思う", score: 0 }, { text: "綺麗すぎて少し怖いと思う", score: 1 }, { text: "誰が何のために言ってるかを考え始める", score: 2 } ] },
      { q: "「SNSで一番怖いのは何？」と聞かれたら？", choices: [ { text: "叩かれることや炎上", score: 0 }, { text: "共感の押し付けや空気感", score: 1 }, { text: "無意識に観察されていること", score: 2 } ] } ];

const results = [
  { type: "共鳴主義者 ☀️", message: "共感でつながるSNSの巡礼者。", max: 8 },
  { type: "構文ナビゲーター 🎭", message: "構文と流れを読む、知性の観測者。", max: 20 },
  { type: "沈黙の観測者 👁", message: "投稿の裏にある感情パターンを静かに読む人。", max: 30 },
  { type: "冷笑ネットワーカー 🕷", message: "ネットの動きを糸のように紡ぐ蜘蛛。", max: 39 },
  { type: "情報生物 💀", message: "SNSを情報として完全に分解する存在。", max: 40 }
];

let current = 0;
let score = 0;

const questionEl = document.getElementById("question");
const choicesEl = document.getElementById("choices");
const resultEl = document.getElementById("result");
const scoreEl = document.getElementById("score");
const typeEl = document.getElementById("type");
const progressBar = document.getElementById("progress-bar");
const tweetBtn = document.getElementById("tweet-button");

function updateProgress() {
  const percent = Math.round((current / questions.length) * 100);
  progressBar.style.width = percent + "%";
}

function showQuestion() {
  const q = questions[current];
  questionEl.textContent = q.q;
  choicesEl.innerHTML = "";
  const shuffled = q.choices.slice().sort(() => Math.random() - 0.5);
  shuffled.forEach(choice => {
    const btn = document.createElement("button");
    btn.textContent = choice.text;
    btn.onclick = () => {
      score += choice.score;
      current++;
      updateProgress();
      if (current < questions.length) {
        showQuestion();
      } else {
        showResult();
      }
    };
    choicesEl.appendChild(btn);
  });
  updateProgress();
}

function showResult() {
  document.getElementById("quiz").style.display = "none";
  const percent = Math.round((score / (questions.length * 2)) * 100);
  scoreEl.textContent = `あなたの冷笑度は ${percent}% です`;
  let type = results.find(r => score <= r.max);
  typeEl.innerHTML = `<strong>${type.type}</strong><br>${type.message}`;
  resultEl.classList.add("visible");
  resultEl.style.display = "block";
  const tweetText = encodeURIComponent(`SNS冷笑度診断☆冷笑度: ${percent}%☆タイプ: ${type.type}☆${type.message}`);
tweetBtn.href = `https://twitter.com/intent/tweet?text=${tweetText}&hashtags=冷笑度診断`;
  tweetBtn.href = `https://twitter.com/intent/tweet?text=${tweetText}`;
}

document.addEventListener("DOMContentLoaded", showQuestion);

  </script>
</body>
</html>
